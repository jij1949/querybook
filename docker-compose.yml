version: '2.1'

x-querybook-image: &querybook-image querybook-dev:latest
x-querybook-depends-on: &querybook-depends-on
    mysql:
        condition: service_healthy
    redis:
        condition: service_healthy
    elasticsearch:
        condition: service_healthy
x-querybook-volumes: &querybook-volumes
    # This is to sync in live code change
    - $PWD:/opt/querybook
    - $PWD/docs_website/static/changelog:/opt/querybook/querybook/static/changelog
    # See https://stackoverflow.com/questions/29181032/add-a-volume-to-docker-but-exclude-a-sub-folder
    - /opt/querybook/node_modules/
    # Make sure the build files don't leak back
    - /opt/querybook/dist/
    - $PWD/containers/bundled_querybook_config.yaml:/opt/querybook/querybook/config/querybook_config.yaml
    # Mount AWS credentials for Glue metastore access
    - $HOME/.aws:/root/.aws:ro
    # - file:/opt/store/

services:
    web:
        container_name: querybook_web
        image: *querybook-image
        tty: true
        stdin_open: true
        # network_mode: 'host'
        command: './querybook/scripts/bundled_docker_run_web --initdb --initweb'
        ports:
            - '${PORT:-10001}:${PORT:-10001}'
        expose:
            - '${PORT:-10001}'
        environment:
            PORT: '${PORT:-10001}'
            APIPORT: '${APIPORT:-3000}'
            HOT_RELOAD: '${HOT_RELOAD:-true}'
        env_file:
            - ./.env.local
        restart: 'always'
        volumes: *querybook-volumes
        depends_on: *querybook-depends-on
        profiles:
            - all
            - web
    worker:
        container_name: querybook_worker
        image: *querybook-image
        tty: true
        stdin_open: true
        command: './querybook/scripts/runservice worker -c 5'
        env_file:
            - ./.env.local
        volumes: *querybook-volumes
        depends_on: *querybook-depends-on
        profiles:
            - all
            - worker
            - mcp
    scheduler:
        container_name: querybook_scheduler
        image: *querybook-image
        tty: true
        stdin_open: true
        command: './querybook/scripts/runservice scheduler --pidfile="/opt/celerybeat.pid"'
        env_file:
            - ./.env.local
        volumes: *querybook-volumes
        depends_on: *querybook-depends-on
        profiles:
            - all
            - scheduler
            - infra
    redis:
        container_name: querybook_redis
        image: redis:6.0.6
        restart: always
        command: ['redis-server', '--appendonly', 'yes']
        hostname: redis
        ports:
            - '6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 30s
            timeout: 10s
            retries: 3
        profiles:
            - all
            - infra
            - redis
            - mcp
    mysql:
        container_name: querybook_mysql
        image: mysql:8.0
        restart: always
        ports:
            # <Port exposed> : < MySQL Port running inside container>
            - '3306:3306'
        expose:
            # Opens port 3306 on the container
            - '3306'
            # Where our data will be persisted
        volumes:
            - my-db:/var/lib/mysql
        environment:
            MYSQL_HOST: mysql:3306
            MYSQL_DATABASE: querybook2
            MYSQL_USER: test
            MYSQL_PASSWORD: passw0rd
            # Password for root access
            MYSQL_ROOT_PASSWORD: hunter2
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    "mysqladmin -h 'localhost' -u test -ppassw0rd ping --silent",
                ]
            interval: 30s
            timeout: 30s
            retries: 3
        command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
        profiles:
            - all
            - infra
            - mysql
            - mcp
    elasticsearch:
        container_name: querybook_elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.18.1 # EG QB version
        environment:
            cluster.name: docker-cluster
            bootstrap.memory_lock: 'true'
            discovery.type: single-node
            xpack.security.enabled: false
            ES_JAVA_OPTS: -Xms750m -Xmx750m
            ingest.geoip.downloader.enabled: false
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
        volumes:
            - esdata1:/usr/share/elasticsearch/data
        ports:
            - 9200:9200
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl --silent --fail localhost:9200/_cluster/health || exit 1',
                ]
            interval: 30s
            timeout: 30s
            retries: 3
        profiles:
            - all
            - infra
            - elasticsearch
            - mcp

    #
    # Kibana - Elasticsearch visualization
    #
    kibana:
        container_name: querybook_kibana
        image: docker.elastic.co/kibana/kibana:7.16.3 # EG QB version
        environment:
            SERVER_NAME: kibana
            ELASTICSEARCH_HOSTS: 'http://elasticsearch:9200'
        ports:
            - '5601:5601'
        expose:
            - '5601'
        depends_on:
            - elasticsearch
        volumes:
            - kibana-data:/usr/share/kibana/data
        profiles:
            - extras
            - kibana

    #
    # MCP Server
    #
    mcp:
        container_name: querybook_mcp
        image: *querybook-image
        tty: true
        stdin_open: true
        command: './querybook/scripts/runservice mcp'
        ports:
            - '${MCP_PORT:-8771}:${MCP_PORT:-8771}'
        expose:
            - '${MCP_PORT:-8771}'
        environment:
            MCP_PORT: '${MCP_PORT:-8771}'
        env_file:
            - ./.env.local
        volumes: *querybook-volumes
        profiles:
            - all
            - mcp

    #
    # Flower - Celery monitoring
    #
    flower:
        container_name: querybook_flower
        image: *querybook-image
        tty: true
        stdin_open: true
        command: './querybook/scripts/runservice flower --port=5566'
        env_file:
            - ./.env.local
        ports:
            - '5566:5566'
        expose:
            - '5566'
        restart: 'always'
        volumes: *querybook-volumes
        depends_on: *querybook-depends-on
        profiles:
            - flower

    #
    # Datadog Agent - for testing purposes
    #
    datadog:
        image: gcr.io/datadoghq/agent:latest
        ports:
            - 8125:8125/udp
        expose:
            - 8125/udp
        environment:
            DD_DOGSTATSD_NON_LOCAL_TRAFFIC: true
            DD_USE_DOGSTATSD: true
            DD_APM_ENABLED: false
            DD_AC_EXCLUDE: '.*'
            DD_ENV: 'dev'
            DD_SERVICE: 'federated-querybook'
            DD_VERSION: 'latest'
        env_file:
            - ./.env.local
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /proc/:/host/proc/:ro
            - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
        profiles:
            - datadog

    #
    # Ollama - AI Assistant
    #
    ollama:
        container_name: querybook_ollama
        image: ollama/ollama:latest
        healthcheck:
            test: ollama --version || exit 1
            interval: 60s
        ports:
            - '11434:11434'
        expose:
            - '11434'
        env_file:
            - ./.env.local
        volumes:
            - ollama-data:/root/.ollama
        profiles:
            - ollama

    #
    # Vector Store - Elasticsearch 8
    #
    vectorstore:
        container_name: querybook_vectorstore
        image: docker.elastic.co/elasticsearch/elasticsearch:8.8.2
        environment:
            cluster.name: docker-cluster
            bootstrap.memory_lock: 'true'
            discovery.type: single-node
            xpack.security.enabled: false
            ES_JAVA_OPTS: -Xms750m -Xmx750m
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
        volumes:
            - vectorstore-data:/usr/share/elasticsearch/data
        ports:
            - 9201:9200
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl --silent --fail localhost:9200/_cluster/health || exit 1',
                ]
            interval: 30s
            timeout: 30s
            retries: 3
        profiles:
            - vectorstore
    vectorstore_kibana:
        container_name: querybook_vectorstore_kibana
        image: docker.elastic.co/kibana/kibana:8.8.2
        environment:
            SERVER_NAME: kibana
            ELASTICSEARCH_HOSTS: 'http://vectorstore:9200'
        ports:
            - '5602:5601'
        expose:
            - '5602'
        depends_on:
            - vectorstore
        volumes:
            - vectorstore-kibana-data:/usr/share/kibana/data
        profiles:
            - vectorstore

    # EMAIL SERVER EXAMPLE
    # If you need email to work use this
    # dockerhostforward:
    #     expose:
    #         - '25'
    #     image: qoomon/docker-host
    #     cap_add: ['NET_ADMIN', 'NET_RAW']
    #     mem_limit: 8M
    #     restart: on-failure

volumes:
    my-db:
    esdata1:
        driver: local
    kibana-data:
        driver: local
    vectorstore-data:
        driver: local
    vectorstore-kibana-data:
        driver: local
    ollama-data:
        driver: local
