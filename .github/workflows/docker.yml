name: Publish Docker
on:
    # Release Please will trigger this workflow when a new release is created
    workflow_dispatch:

env:
    IMAGE_NAME: egdp-querybook
    PUBLIC_REGISTRY: artifactory-edge.expedia.biz
    REGISTRY: egdataplatform-docker-internal-local.artylab.expedia.biz

jobs:
    publish-docker:
        name: Push Docker image to Docker Hub
        runs-on: eg-default

        steps:
            - name: Checkout ${{ github.event.release.tag_name }}
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name }}

            - name: Log into registry ${{ env.REGISTRY }}
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ secrets.CICD_ARTYLAB_PUBLISH_USER }}
                  password: ${{ secrets.CICD_ARTYLAB_PUBLISH_TOKEN }}

            - name: Log into public registry ${{ env.PUBLIC_REGISTRY }}
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.PUBLIC_REGISTRY }}
                  username: ${{ secrets.CICD_ARTIFACTORYCLOUD_USER }}
                  password: ${{ secrets.CICD_ARTIFACTORYCLOUD_TOKEN }}

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3
              with:
                  driver: docker

            - name: Docker metadata
              uses: docker/metadata-action@v5
              id: meta
              with:
                  images: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  flavor: |
                      latest=false
                  tags: |
                      type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
                      type=sha,enable=true,priority=100,prefix=sha-,suffix=,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}

            - name: Docker build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  provenance: false
                  build-args: |
                      EXTRA_PIP_INSTALLS=extra.txt
